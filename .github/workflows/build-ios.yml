name: Build iOS App in Cloud (GitHub Actions)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-ios:
    name: Build iOS Native App
    runs-on: macos-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install npm dependencies
        run: npm install

      - name: Build Web App
        run: npm run build

      - name: Sync Capacitor Native Project
        run: npx cap sync ios

      - name: Build iOS App Binary (No Mac Needed Locally)
        run: |
          xcodebuild -workspace ios/App/App.xcworkspace \
                     -scheme App \
                     -configuration Release \
                     -sdk iphoneos \
                     -derivedDataPath build \
                     CODE_SIGN_IDENTITY="" \
                     CODE_SIGNING_REQUIRED=NO \
                     CODE_SIGNING_ALLOWED=NO

      - name: Compress Built App for Download
        run: |
          cd build/Build/Products/Release-iphoneos
          zip -r CIT_Gazette_iOS_App.zip App.app

      - name: Upload iOS App Artifact
        uses: actions/upload-artifact@v4
        with:
          name: CIT-Gazette-iOS-App
          path: build/Build/Products/Release-iphoneos/CIT_Gazette_iOS_App.zip
